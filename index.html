<style id="premium-ui-v07">
/* V0.7 visual layer — structure and application behavior intentionally unchanged */
:root{
  --side:264px;
  --rail:58px;
  --drawer:318px;
  --bg:#f3f4f7;
  --surface:rgba(255,255,255,.88);
  --line:rgba(21,25,32,.09);
  --ink:#17191d;
  --muted:#777d88;
  --dark:#111216;
  --accent:#6d5dfc;
  --accent-2:#8d7fff;
  --accent-soft:#efedff;
  --shadow-sm:0 1px 2px rgba(21,25,32,.04),0 5px 16px rgba(21,25,32,.045);
  --shadow-md:0 16px 44px rgba(21,25,32,.09),0 2px 8px rgba(21,25,32,.04);
  --ease:cubic-bezier(.22,1,.36,1);
}
html{background:#111216}
body{
  background:var(--bg);
  font-family:Inter,"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,textarea{-webkit-tap-highlight-color:transparent}
button{transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .24s var(--ease),transform .24s var(--ease)}
button:active{transform:scale(.97)}
button:focus-visible,textarea:focus-visible{outline:3px solid rgba(109,93,252,.2);outline-offset:2px}
svg{stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.app{
  background:var(--bg);
  transition:grid-template-columns .42s var(--ease);
}
.sidebar{
  position:relative;
  overflow:hidden;
  border-right:1px solid rgba(255,255,255,.055);
  background:
    radial-gradient(circle at 12% -5%,rgba(127,112,255,.18),transparent 27%),
    linear-gradient(175deg,#17181d 0%,#101115 48%,#0d0e11 100%);
  box-shadow:12px 0 34px rgba(14,15,18,.07);
}
.sidebar::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.2;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:100% 4px;
}
.sidebar>*{position:relative;z-index:1}
.brand{height:64px;padding:0 16px;gap:11px}
.brandMark{
  width:34px;height:34px;border-radius:11px;
  background:linear-gradient(145deg,#fafaff 5%,#d9d5ff 92%);
  box-shadow:0 8px 26px rgba(109,93,252,.24),inset 0 0 0 1px rgba(255,255,255,.8);
  font-size:10px;letter-spacing:.06em;
}
.brand b{font-size:13px;letter-spacing:-.01em;color:#f5f5f8}
.brand small{font-size:9px;color:#747986;letter-spacing:.015em}
.mode{
  margin:3px 12px 10px;padding:4px;
  border-color:rgba(255,255,255,.07);
  background:rgba(255,255,255,.035);
  border-radius:11px;
}
.mode button{height:29px;font-size:10px;border-radius:8px}
.mode button:hover:not(.active){color:#c0c3cb;background:rgba(255,255,255,.045)}
.mode button.active{
  background:linear-gradient(180deg,#fff,#eeedf5);
  box-shadow:0 4px 14px rgba(0,0,0,.24);
}
.scroll{padding:2px 9px 14px;scrollbar-width:thin;scrollbar-color:#303239 transparent}
.navBtn,.project{min-height:36px;padding:8px 10px;border-radius:9px;font-size:11px}
.navBtn:hover,.navBtn.active,.project:hover,.project.active{background:rgba(255,255,255,.07)}
.navBtn.active,.project.active{box-shadow:inset 0 0 0 1px rgba(255,255,255,.045)}
.navBtn.active .ico,.project.active .ico{color:#a99fff}
.ico{color:#737986;transition:color .2s ease,transform .25s var(--ease)}
.navBtn:hover .ico,.project:hover .ico{color:#c7c3ff;transform:translateX(1px)}
.section{padding:15px 9px 7px;font-size:8px;color:#5e636d;letter-spacing:.12em}
.project b{font-size:10px;font-weight:620}
.project small{font-size:8px;color:#666c77}
.threads{padding-left:37px}
.thread{font-size:9px;padding:7px 8px;border-radius:7px;border-left:1px solid rgba(255,255,255,.06)}
.thread:hover{background:rgba(255,255,255,.055);color:#e5e5ea;transform:translateX(2px)}
.bottom{height:56px;border-top-color:rgba(255,255,255,.065);background:rgba(5,6,8,.3);backdrop-filter:blur(16px)}
.avatar{border-radius:10px;background:linear-gradient(145deg,#f8f8fc,#dad6ff);box-shadow:0 5px 14px rgba(0,0,0,.18)}
.bottom .iconBtn:hover{background:rgba(255,255,255,.08)}
.dot{width:7px;height:7px;background:#ff6673;box-shadow:0 0 0 3px #111216,0 0 12px rgba(255,102,115,.7)}

.main{min-height:0;overflow:hidden;grid-template-rows:64px minmax(0,1fr);background:var(--bg)}
.topbar{
  height:64px;padding:0 24px;
  background:rgba(255,255,255,.78);
  border-bottom-color:var(--line);
  backdrop-filter:blur(22px) saturate(150%);
  position:relative;z-index:20;
}
.topTitle b{font-size:13px;font-weight:680;letter-spacing:-.012em}
.topTitle small{font-size:9px;margin-top:4px;color:#858a95}
.workspace{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 17% 0%,rgba(142,127,255,.09),transparent 30%),
    radial-gradient(circle at 86% 12%,rgba(84,160,255,.055),transparent 25%),
    linear-gradient(180deg,#f8f8fa 0%,#f1f2f5 100%);
}
.workspace::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.33;
  background-image:radial-gradient(rgba(60,64,72,.12) .55px,transparent .55px);
  background-size:18px 18px;
  mask-image:linear-gradient(to bottom,black,transparent 68%);
}
.workspace>*{position:relative}
.workspace>.tabs{grid-row:1}
.workspace>.content{grid-row:2}
.workspace>.composerWrap{grid-row:3}
.tabs{height:48px;padding:0 23px;gap:9px;background:rgba(255,255,255,.66);backdrop-filter:blur(18px);border-bottom-color:var(--line)}
.tabs button{height:40px;padding:0 11px;font-size:11px;position:relative}
.tabs button.active{box-shadow:none;color:#22242a}

.activityIcon{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#f2f1ff,#e7e5fb);color:#5f53cf;font-weight:700}
.activity b{font-size:10px}.activity p{font-size:9px;line-height:1.55}

.memberMini::after{content:"";position:absolute;width:80px;height:80px;right:-42px;bottom:-48px;border-radius:50%;background:rgba(109,93,252,.08);transition:transform .4s var(--ease)}

.send{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#292b31,#121318);box-shadow:0 7px 16px rgba(17,18,22,.18)}
.send:hover{background:linear-gradient(145deg,#7769ff,#5d4ee6);box-shadow:0 10px 22px rgba(93,78,230,.28);transform:translateY(-1px)}
.plusMenu{bottom:42px;width:230px;border-color:rgba(28,31,38,.1);border-radius:14px;padding:7px;box-shadow:var(--shadow-md);animation:menuIn .22s var(--ease) both;transform-origin:bottom left}
.plusMenu button{padding:9px;border-radius:9px;font-size:10px}

.tools{background:#f1f2f5;border-left-color:var(--line)}

.rail .iconBtn{width:34px;height:34px;border-radius:10px}
.rail .iconBtn:hover,.rail .iconBtn.active{background:#fff;color:#5d51ce;box-shadow:0 6px 18px rgba(31,34,42,.08);transform:translateY(-1px)}
.drawer{background:rgba(255,255,255,.9);backdrop-filter:blur(22px)}
.drawerHead{height:64px;border-bottom-color:var(--line);padding:0 15px}.drawerHead b{font-size:12px}
.drawerBody{padding:14px}
.file{padding:11px;border-color:rgba(28,31,38,.08);border-radius:11px;background:rgba(248,248,250,.8);transition:.22s ease}
.file:hover{border-color:rgba(109,93,252,.17);background:#fff;transform:translateX(2px)}
.file b{font-size:10px}.file small{font-size:8px}
.browser,.terminal,.sideBubble{border-radius:12px}
.notice{right:78px;bottom:22px;width:300px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(22,23,28,.94);backdrop-filter:blur(20px);box-shadow:0 22px 54px rgba(0,0,0,.28);animation:toastIn .38s var(--ease) both}
.notice b{font-size:11px}.notice p{font-size:9px;line-height:1.45}

/* Scrollbars */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(76,80,91,.18);border:2px solid transparent;background-clip:padding-box;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(76,80,91,.3);border:2px solid transparent;background-clip:padding-box}

/* Motion */
@keyframes pageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
@keyframes listIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes menuIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

/* Responsive compatibility, without changing information architecture */
@media(max-width:1180px){
  :root{--side:228px;--drawer:286px}
  .content{padding:24px 22px 48px}
  .grid{grid-template-columns:1fr 1fr}.card.wide{grid-column:span 2}

}
@media(max-width:860px){

  .section,.project .meta,.project>span:last-child,.threads,.thread,.bottom .user b{display:none}
  .navBtn,.project{justify-content:center;padding:8px}.navBtn .ico,.project .ico{margin:0}
  .bottom{padding:8px 7px;justify-content:center}.bottom .user{flex:0 0 auto}.bottom>.iconBtn:nth-of-type(1),.bottom>.iconBtn:nth-of-type(2){display:none}
  .topbar{padding:0 18px}.grid{grid-template-columns:1fr}.card.wide{grid-column:span 1}
  .two{grid-template-columns:1fr}.composerWrap{padding-inline:14px}.content{padding:22px 17px 44px}
}
@media(max-width:640px){
  :root{--side:64px;--rail:0px;--drawer:0px}
  .app,.app.drawerOpen{grid-template-columns:var(--side) minmax(0,1fr)}
  .tools{display:none}.sidebar{grid-template-rows:58px 42px minmax(0,1fr) 52px}.brandMark{width:31px;height:31px}
  .main{grid-template-rows:58px minmax(0,1fr)}.topbar{height:58px;padding:0 13px}.topbar>.light{font-size:0;min-width:32px;padding:0}.topbar>.light::after{content:"1";font-size:9px}
  .topTitle small{max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .content{padding:18px 12px 38px}.dashTop{margin-bottom:14px}.dashTop h2,.activityHead h2{font-size:19px}.dashTop p{font-size:9px}
  .grid{gap:10px}.card{padding:14px;border-radius:15px}.activityHead{align-items:flex-start;flex-direction:column}.filters{width:100%;overflow:auto}.filters button{white-space:nowrap;flex:1}
  .memberCards{grid-template-columns:1fr}.suggestions{grid-template-columns:1fr}.hero h1{font-size:29px}.hero p{font-size:10px}
  .composerWrap{padding:8px 9px 11px}.composer{border-radius:16px}.composer textarea{height:46px;font-size:11px}.composerLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dmBubble{max-width:80%}.notice{left:76px;right:12px;bottom:12px;width:auto}
}
@supports not (backdrop-filter:blur(1px)){
  .topbar,.tabs,.composer,.drawer,.bottom,.rail{background:#fff}.bottom{background:#101115}.composer{background:#fff}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}

function render(){document.getElementById('app').innerHTML=`<div class="app ${state.drawer?'drawerOpen':''}">${sidebar()}<main class="main">${title()}<section class="workspace ${contextViewActive()?'contextView':''}">${tabs()}${body()}${composer()}</section></main>${tools()}</div>${createProjectModal()}${notificationDrawer()}`}

document.addEventListener('click',e=>{let x=e.target.closest('[data-a]');if(!x)return;let a=x.dataset.a;if(a==='mode'){state.remindersOpen=false;state.notificationsOpen=false;state.memberDM=null;state.projectThread=null;state.taskContext=null;state.mode=x.dataset.mode;state.nav=null;state.projectId=null;state.swarmId=null;if(state.mode==='work'){state.view='daily';state.dash=true}else state.view='chat'}else if(a==='nav'){state.remindersOpen=false;state.notificationsOpen=false;state.memberDM=null;state.projectThread=null;state.taskContext=null;state.swarmId=null;state.nav=x.dataset.id;if(state.nav==='new'){state.nav=null;state.mode='chat';state.view='chat';state.projectId=null}}else if(a==='swarmChat'){state.memberDM=null;state.projectThread=null;state.taskContext=null;state.mode='work';state.view='swarm';state.swarmId=x.dataset.id;state.projectId=null;state.nav=null;state.tab='activity';state.filter='mine'}else if(a==='project'){state.remindersOpen=false;state.notificationsOpen=false;state.memberDM=null;state.projectThread=null;state.taskContext=null;state.swarmId=null;state.projectId=x.dataset.id;state.nav=null;state.mode='work';state.view='project';if(!state.tab)state.tab='activity'}else if(a==='thread'){state.remindersOpen=false;state.notificationsOpen=false;state.memberDM=null;state.taskContext=null;state.projectId=x.dataset.id;state.projectThread=x.dataset.title;state.nav=null;state.mode='work';state.view='project';toast('已打开项目对话',`${x.dataset.title} · 已连接 ${p()?.name||'项目'} 上下文`)}else if(a==='history'){state.projectThread=null;state.taskContext=null;state.projectId=null;state.mode='chat';state.view='chat';state.nav=null}else if(a==='toggleProject'){state.expanded[x.dataset.id]=!state.expanded[x.dataset.id]}else if(a==='newProjectThread'){let pr=[...projects,...personalProjects].find(v=>v.id===x.dataset.id);if(pr){let base='新项目对话',i=1,title=base;while(pr.threads.includes(title))title=`${base} ${++i}`;pr.threads.unshift(title);state.expanded[pr.id]=true;state.memberDM=null;state.projectId=pr.id;state.projectThread=title;state.taskContext=null;state.nav=null;state.mode='work';state.view='project';toast('已创建项目对话',`已自动携带「${pr.name}」项目上下文`)}}else if(a==='openTaskContext'){state.remindersOpen=false;state.notificationsOpen=false;state.memberDM=null;state.projectThread=null;state.taskContext=null;state.mode='work';state.view='project';state.nav=null;state.taskContext={id:x.dataset.id,title:x.dataset.title,status:x.dataset.status,priority:x.dataset.priority,deadline:x.dataset.deadline,goal:x.dataset.id==='EMP-UI-01'?'完成新版员工端原型并形成可评审 Result。':'完成当前任务要求。',dependency:x.dataset.id==='FE-12'?'等待 EMP-UI-01 Result':'当前无阻塞依赖'};toast('已进入任务工作上下文',`${x.dataset.id} · ${x.dataset.title}`)}else if(a==='backProject'){state.projectThread=null;state.taskContext=null;state.mode='work';state.view='project';state.projectId=x.dataset.id;state.nav=null}else if(a==='backTaskList'){state.projectThread=null;state.taskContext=null;state.mode='work';state.view='project';state.projectId=x.dataset.id;state.tab='tasks';state.nav=null}else if(a==='projectMore'){let pr=[...projects,...personalProjects].find(v=>v.id===x.dataset.id);toast(pr?.name||'项目','更多项目操作将在后续版本补充')}else if(a==='createPersonalProject'){state.createProject=true}else if(a==='cancelCreateProject'||a==='modalMask'){state.createProject=false}else if(a==='confirmCreateProject'){let name=(document.getElementById('newProjectName')?.value||'').trim();let desc=(document.getElementById('newProjectDesc')?.value||'').trim();if(!name){toast('请输入项目名称','项目名称为必填项');return}let id='personal_'+Date.now();personalProjects.unshift({id,name,meta:'个人项目',description:desc||'个人项目',threads:[]});state.expanded[id]=true;state.createProject=false;state.memberDM=null;state.projectThread=null;state.taskContext=null;state.mode='work';state.view='project';state.projectId=id;state.nav=null;state.tab='activity';state.filter='mine';toast('个人项目已创建',`已进入「${name}」项目工作区`)}else if(a==='dash'){state.memberDM=null;state.projectThread=null;state.taskContext=null;state.mode='work';state.nav=null;state.view='daily';state.projectId=null;state.swarmId=null;state.dash=!state.dash}else if(a==='closeDash')state.dash=false;else if(a==='tab'){state.memberDM=null;state.tab=x.dataset.tab}else if(a==='filter'){state.memberDM=null;state.filter=x.dataset.filter}else if(a==='tool'){state.tool=x.dataset.tool;state.drawer=true}else if(a==='drawerClose')state.drawer=false;else if(a==='plus')state.plus=!state.plus;else if(a==='insert'){let i=document.getElementById('input');if(i)i.value+=x.dataset.t;state.plus=false}else if(a==='at'){let i=document.getElementById('input');if(i){i.value+=state.memberDM?`@${state.memberDM} `:(state.mode==='work'&&((state.view==='project'&&state.tab==='activity')||(state.view==='swarm'&&state.tab==='activity')))?'@张明 ':'@AI总管 ';i.focus()}}else if(a==='speech'){let i=document.getElementById('input');if(i)i.value+='[语音转文字] 今天我最重要的任务是什么？';toast('语音转文字','V0.1 以文本模拟识别结果')}else if(a==='send'){let i=document.getElementById('input');if(!i||!i.value.trim())return;let human=state.mode==='work'&&!contextViewActive()&&((state.view==='project'&&state.tab==='activity')||(state.view==='swarm'&&state.tab==='activity'));toast(state.memberDM?`已发送给 ${state.memberDM}`:human?(state.view==='swarm'?'已发送到产品创新蜂群':'已发送给项目成员'):'已路由 AI','当前上下文已保留')}else if(a==='whyFocus'){state.focusWhy=!state.focusWhy}else if(a==='resumeFocus'){state.projectId='employee';state.view='project';state.tab='tasks';state.nav=null;toast('继续工作','已恢复员工端原型的当前任务上下文')}else if(a==='viewFocusTask'){state.projectId='employee';state.view='project';state.tab='tasks';state.nav=null}else if(a==='handleReview'){toast('打开 Review','进入 Prototype V5 的评审上下文')}else if(a==='quickAction'){toast('已处理','原型中模拟完成当前快捷动作')}else if(a==='openDM'){state.memberDM=x.dataset.name;state.filter='members'}else if(a==='backMembers'){state.memberDM=null;state.filter='members'}else if(a==='backScope'){state.memberDM=null;state.filter='all'}else if(a==='agentChat'){state.mode='chat';state.view='chat';state.nav=null;toast('已打开 Agent 对话',x.dataset.agent)}else if(a==='reminderToggle'){state.remindersOpen=!state.remindersOpen;state.notificationsOpen=false}

else if(a==='reminderTask'){state.remindersOpen=false;state.memberDM=null;state.projectThread=null;state.taskContext={id:'EMP-UI-01',title:'新版员工端原型',status:'Working',priority:'P0',deadline:'今天18:00',goal:'完成新版员工端原型并形成可评审 Result。',dependency:'当前无阻塞依赖'};state.mode='work';state.view='project';state.projectId='employee';state.nav=null}
else if(a==='reminderView'){let r=reminders.find(v=>v.id===x.dataset.rid);state.remindersOpen=false;if(r?.type==='meeting'){toast('员工端设计评审','15:30 · 6人 · 员工端原型')}else if(r?.type==='automation'){state.nav='auto';state.mode='work';toast('自动化提醒',r.title)}}
else if(a==='reminderAll'){state.remindersOpen=false;toast('提醒中心','MVP 当前以右上角提醒浮层为主，完整列表后续扩展')}
else if(a==='profile')state.nav='profile';else if(a==='settings')state.nav='settings';else if(a==='notice'){state.notificationsOpen=!state.notificationsOpen;state.remindersOpen=false}else if(a==='suggest')toast('Enterprise Brain','已按当前上下文自动路由合适 Agent。');render()});render();window.__EB_V01__={state,render};
